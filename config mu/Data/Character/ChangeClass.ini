;==================================================
; SilentDevs - Change Class [F4]
;==================================================
; Este sistema permite cambiar la clase del personaje desde la ventana F4.
; Flujo: el cliente abre F4, el GameServer envia el precio segun AccountLevel,
; y al elegir una clase el servidor descuenta el costo y cambia la clase.
;
; Requisitos/validaciones del servidor:
; - El personaje debe tener suficiente moneda segun PriceType_ALx.
; - Debe quitarse todo el equipo antes de cambiar de clase.
; - El cambio limpia skills/quest y recalcula atributos.
; - El comportamiento de Master Level depende de ClearMasterChangeClass en GameServerInfo.
;
; AccountLevel:
; AL0 = cuenta normal
; AL1 = VIP Bronze
; AL2 = VIP Silver
; AL3 = VIP Gold
;
; PriceType:
; 0 = Zen
; 1 = SilentDevs Coin / WCoinC
; 2 = WCoinP
; 3 = Goblin Point
;==================================================

[Common]
PriceType_AL0 = 1
PriceType_AL1 = 1
PriceType_AL2 = 1
PriceType_AL3 = 1

Price_AL0 = 30000
Price_AL1 = 28000
Price_AL2 = 25000
Price_AL3 = 22000