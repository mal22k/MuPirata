[SDAntiHack]
; Primera fase segura: solo registra detecciones, no desconecta ni sanciona.
Enable=1
ReportOnly=1

; Valkyria / Auto-Pot No Limits.
; Control real de curacion: el servidor solo acepta una pota HP cada 150ms.
; Esto evita que Auto HP o un cliente modificado conviertan el PvP en curacion infinita.
EnablePotionCooldown=1
MinPotionUseIntervalMs=150
PotionCooldownReportCount=8

; Detector anti-spam: intentos sostenidos por debajo de 100ms quedan registrados.
MinPotionIntervalMs=100
PotionBurstReportCount=5

; Valkyria / Trade Attack.
MinTradeIntervalMs=1200
TradeBurstReportCount=3

; Fly/Magnet/Wall por saltos imposibles. El servidor ya rechaza >15.
MaxMoveDelta=15

; Valkyria / Skill Distance / Hit-Hack.
; Fase inicial: PvP/objetivos jugador. PvM queda apagado para evitar ruido con mobs/NPCs.
EnableSkillDistance=1
SkillDistanceTolerance=2
SkillDistanceBurstReportCount=2
SkillDistanceReportPvm=0

; Valkyria / xSkills / spam extremo de paquetes.
; Conservador: solo reporta el mismo skill repetido por debajo de 80ms y sostenido.
; MultiSkill se desactiva en esta fase porque Evil Spirit, Triple Shot, Flame y Fire Scream generan paquetes legitimos con intervalos 0ms.
EnableSkillInterval=1
EnableSkillIntervalMultiSkill=0
IgnoreDarkSideSkillInterval=1
MinSkillIntervalMs=80
SkillIntervalBurstReportCount=5

; Valkyria / Hit-Hack / ataque basico demasiado rapido.
; Solo mide CGAttackRecv, no skills. Usa ventana de tiempo porque el cliente puede agrupar paquetes legitimos en el mismo tick.
EnableAttackSpeed=1
MinAttackIntervalMs=50
AttackSpeedWindowMs=1000
AttackSpeedMaxCount=45
AttackSpeedBurstReportCount=3

; Valkyria / Flood general de paquetes sensibles.
; Cuenta acciones observadas por el servidor en ventanas cortas. Conservador para no afectar juego normal.
EnablePacketFlood=1
PacketFloodWindowMs=1000
PacketFloodMaxCount=160
PacketFloodBurstReportCount=3

; Sistema profesional de score por sesion.
; Cada deteccion suma severidad, pero el score baja con el tiempo para no castigar eventos viejos.
EnableScoreDecay=1
ScoreDecayIntervalMs=60000
ScoreDecayAmount=10
ScoreAlertThreshold=50

; Evita spamear logs cuando una misma accion explota muchas veces por segundo.
ReportCooldownMs=1000

; Reservado para cuando ReportOnly=0.
BlockScore=80

; Ruta relativa desde 3-GameServer o 6-GameServerCS.
; Centraliza todo en el panel SDServer.
LogPath=..\SDServer\LOG\SDShield
