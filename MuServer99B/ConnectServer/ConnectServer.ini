[ConnectServerInfo]

;==================================================
; Customer Settings
;==================================================
; Unique identifier for the customer license.
CustomerLicenseId = 0

;==================================================
; Connection Settings
;==================================================
; TCP port used by the client to connect to the server.
ConnectServerPortTCP = 44405

; UDP port used by the Game Server (GS) to maintain its connection.
ConnectServerPortUDP = 55557

; Maximum idle time (in seconds) before disconnecting a client.
MaxConnectionIdle = 60

; Maximum allowed simultaneous connections per IP address.
MaxConnectionPerIP = 5

; Maximum allowed packets per second per client (to prevent packet spam).
MaxPacketPerSecond = 30

; Maximum allowed bytes per second per client (0 = no limit).
MaxBytesPerSecond = 100
