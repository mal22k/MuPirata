****************************************************************************
*** SOME OPTIONS DESCRIBED HERE MAY NOT BE AVAILABLE IN CERTAIN VERSIONS ***
****************************************************************************

[MainInfo]
CustomerName -> Username used for logging into the website.
LauncherStart -> Launch only by SSeMU or other launchers (0=Off/1=On).
LauncherMutex -> Mutex name from the launcher.
IpAddress -> IP address of the Connect Server computer.
IpAddressPort -> Port of the Connect Server.
ClientVersion -> Client version (Must match ServerVersion on GameServer).
ClientSerial -> Client serial (Must match ServerSerial on GameServer).
WindowName -> Name of the game window.
ScreenShotPath -> Path for game screenshots.
ClientName -> Name of the Main.dll.
PluginName1 -> Name of the plugin DLL, if any (Place the DLL inside the folder).
PluginName2 -> Name of the plugin DLL, if any (Place the DLL inside the folder).
PluginName3 -> Name of the plugin DLL, if any (Place the DLL inside the folder).
PluginName4 -> Name of the plugin DLL, if any (Place the DLL inside the folder).
PluginName5 -> Name of the plugin DLL, if any (Place the DLL inside the folder).

[HelperInfo]
HelperActiveAlert -> Warning when Helper reaches configured level (0=Off/1=On)
HelperActiveLevel -> Minimum level to use the Helper

[AnimationInfo]
DWAttackAnimationValue -> Attack animation value for Dark Wizard (15=Default/3=Fix attack animation on high speeds).
DKAttackAnimationValue -> Attack animation value for Dark Knight (15=Default/3=Fix attack animation on high speeds).
FEAttackAnimationValue -> Attack animation value for Fairy Elf (15=Default/3=Fix attack animation on high speeds).
MGAttackAnimationValue -> Attack animation value for Magic Gladiator (15=Default/3=Fix attack animation on high speeds).
DLAttackAnimationValue -> Attack animation value for Dark Lord (15=Default/3=Fix attack animation on high speeds).
SUAttackAnimationValue -> Attack animation value for Summoner (15=Default/3=Fix attack animation on high speeds).
RFAttackAnimationValue -> Attack animation value for Rage Fighter (15=Default/3=Fix attack animation on high speeds).

[KeyInfo]
KeyCodeAutoAttackSwitch -> Key code to activate Auto Attack (0=Disable).
KeyCodeHealthBarSwitch -> Key code to toggle health bar visibility (0=Disable).
KeyCodeCamera3DSwitch -> Key code to switch active camera (0=Disable).
KeyCodeCamera3DRestore -> Key code to restore camera (0=Disable).
KeyCodeTrayModeSwitch -> Key code to toggle tray mode (0=Disable).

[ReconnectInfo]
ReconnectTime -> Maximum time, in milliseconds, the main will wait for reconnection.

[CustomInfo]
AdvancedOptionMenuSwitch -> Advanced options menu in the client (0=Off/1=On).
GoldenArcherRenewalSwitch -> Renewed mode of the Golden Archer (0=Off/1=On).
ItemMoveRightClickSwitch -> Enables equipping and unequipping items with right-click (0=Off/1=On).
MiniMapSwitch -> Enable minimap. (0=Off/1=On).
WindowEventTimeSwitch -> Window displaying event schedule using the H key (0=Off/1=On).

[ResourceInfo]
IncreaseFPSSwitch -> This option slightly accelerates the game to achieve better FPS. (0=Off/1=On)
ReduceConsumption -> This option reduces CPU and RAM consumption. (0=Off/1=On)
UseOldMainFrameBar -> This option downgrades the game's main interface bar. (0=Off/1=On)